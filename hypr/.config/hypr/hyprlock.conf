# Lock screen (Super+L). hyprlock can't play video, so the background is a still
# frame of the mpvpaper wallpaper, made with:
#   ffmpeg -ss 2 -i ~/.wallpaper/cherry-blossom-ghost-of-tsushima-moewalls-com.mp4 \
#     -frames:v 1 ~/.wallpaper/cherry-blossom-lock.png

general {
    hide_cursor = true
}

background {
    path = ~/.wallpaper/cherry-blossom-lock.png
    blur_passes = 1
    brightness = 0.8
}

label {
    text = $TIME
    font_size = 72
    color = rgba(255, 255, 255, 0.95)
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.6)
    inner_color = rgba(20, 20, 20, 0.6)
    font_color = rgba(255, 255, 255, 1.0)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -120
    halign = center
    valign = center
}
